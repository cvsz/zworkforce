name: ZARVIS

on:
  pull_request:
    paths:
      - "packages/zarvis/**"
      - "tests/test_zarvis_package.py"
      - "tests/test_dependabot_coverage.py"
      - "tests/test_zarvis_api_rename.py"
      - "tests/test_zarvis_windows_targeting.py"
      - ".github/workflows/zarvis.yml"
  push:
    branches: [main]
    paths:
      - "packages/zarvis/**"
      - "tests/test_zarvis_package.py"
      - "tests/test_dependabot_coverage.py"
      - "tests/test_zarvis_api_rename.py"
      - "tests/test_zarvis_windows_targeting.py"
      - ".github/workflows/zarvis.yml"

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest tests.test_zarvis_package -v

  node-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zarvis
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/zarvis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm test

  zarvis-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zarvis/services/zarvis-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/zarvis/services/zarvis-api/requirements.txt
      - run: pip install --no-cache-dir -r requirements.txt pytest pip-audit
      - run: python -m pytest tests -q
      - run: PYTHONPATH=../.. python -m unittest discover -s ../../tests -v
      - run: pip-audit -r requirements.txt

  zarvis-windows-linux-restore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zarvis/apps/zarvis-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/ZARVIS.Windows/ZARVIS.Windows.csproj
      - run: dotnet restore tests/ZARVIS.Windows.Tests/ZARVIS.Windows.Tests.csproj
