name: zTrader Intelligence

on:
  pull_request:
    paths:
      - "packages/ztrader/zeaz-intelligence/**"
      - ".github/workflows/ztrader-intelligence.yml"
  push:
    branches:
      - main
    paths:
      - "packages/ztrader/zeaz-intelligence/**"
      - ".github/workflows/ztrader-intelligence.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ztrader/zeaz-intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ztrader/zeaz-intelligence/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: packages/ztrader/zeaz-intelligence
          push: false
          tags: ztrader-intelligence:ci
