name: zTrader Intelligence

on:
  pull_request:
    paths:
      - "packages/ztrader/zeaz-intelligence/**"
      - ".github/workflows/ztrader-intelligence.yml"
  push:
    branches:
      - main
    paths:
      - "packages/ztrader/zeaz-intelligence/**"
      - ".github/workflows/ztrader-intelligence.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ztrader/zeaz-intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ztrader/zeaz-intelligence/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          ruff check --output-format=github src tests 2>&1 | tee ruff-diagnostics.txt
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ztrader-ruff-diagnostics
          path: packages/ztrader/zeaz-intelligence/ruff-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-diagnostics.txt
      - name: Upload Pytest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ztrader-pytest-diagnostics
          path: packages/ztrader/zeaz-intelligence/pytest-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: packages/ztrader/zeaz-intelligence
          push: false
          tags: ztrader-intelligence:ci
