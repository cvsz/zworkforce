name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    outputs:
      version: ${{ steps.meta.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag, source and main ancestry
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable semantic version tag required" >&2; exit 2; }
          python3 scripts/verify_release.py --expected "$VERSION"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Python distributions
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
          python3 -m pip install dist/*.whl
          zworkforce --version

      - name: Generate SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_sbom.py --output "dist/zworkforce-${{ steps.meta.outputs.version }}.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

  windows-client:
    name: Windows client release
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Configure trusted MSIX signing
        id: signing
        env:
          WINDOWS_MSIX_PFX_BASE64: ${{ secrets.WINDOWS_MSIX_PFX_BASE64 }}
          WINDOWS_MSIX_PFX_PASSWORD: ${{ secrets.WINDOWS_MSIX_PFX_PASSWORD }}
          WINDOWS_MSIX_PUBLISHER: ${{ vars.WINDOWS_MSIX_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PFX_PASSWORD)) {
              "has_signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "Trusted MSIX signing secrets are not configured; skipping Windows MSIX release artifacts."
              exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "zworkforce-release-signing.pfx"
          try {
              $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_MSIX_PFX_BASE64)
          } catch {
              throw "WINDOWS_MSIX_PFX_BASE64 is not valid base64."
          }
          if ($pfxBytes.Length -eq 0) {
              throw "WINDOWS_MSIX_PFX_BASE64 decoded to an empty file."
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          "ZWORKFORCE_MSIX_SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZWORKFORCE_MSIX_SIGNING_PFX_PASSWORD=$env:WINDOWS_MSIX_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZWORKFORCE_MSIX_REQUIRE_TRUSTED_SIGNING=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PUBLISHER)) {
              "ZWORKFORCE_MSIX_SIGNING_PUBLISHER=$env:WINDOWS_MSIX_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "has_signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Audit Windows client environment
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Install-Prerequisites.ps1 -CheckOnly

      - name: Restore
        if: steps.signing.outputs.has_signing == 'true'
        run: dotnet restore ZWorkforceClient/ZWorkforceClient.sln

      - name: Build client
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Build-Client.ps1 -Configuration Release -Platform x64

      - name: Run core tests
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release

      - name: Package versioned MSIX
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Package-Client.ps1 -Configuration Release -Platform x64 -Version "${{ needs.prepare-release.outputs.version }}"

      - name: Launch smoke check
        if: steps.signing.outputs.has_signing == 'true'
        timeout-minutes: 8
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release -ExpectedVersion "${{ needs.prepare-release.outputs.version }}.0" -LaunchSmoke

      - name: Generate Windows checksums
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          $packageDirectory = Join-Path $PWD "ZWorkforceClient\out\Release-x64"
          $packages = @(Get-ChildItem -LiteralPath $packageDirectory -File |
              Where-Object { $_.Extension -in ".msix", ".msixbundle" })
          if ($packages.Count -eq 0) {
              throw "No Windows package was produced for the release."
          }
          foreach ($package in $packages) {
              $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              [IO.File]::WriteAllText(
                  "$($package.FullName).sha256",
                  "$hash  $($package.Name)`n",
                  [Text.UTF8Encoding]::new($false)
              )
          }

      - name: Upload Windows release artifact
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-windows-client-${{ github.ref_name }}
          path: |
            ZWorkforceClient/out/Release-x64/*.msix
            ZWorkforceClient/out/Release-x64/*.cer
            ZWorkforceClient/out/Release-x64/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows diagnostics
        if: failure() && steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-windows-client-diagnostics-${{ github.run_number }}
          path: |
            ZWorkforceClient/src/**/bin/**
            ZWorkforceClient/src/**/obj/**
            ZWorkforceClient/out/**
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish release
    needs: [prepare-release, windows-client]
    if: always() && needs.prepare-release.result == 'success' && (needs.windows-client.result == 'success' || needs.windows-client.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Python release artifacts
        uses: actions/download-artifact@v8
        with:
          name: zworkforce-${{ github.ref_name }}
          path: dist

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: zworkforce-windows-client-${{ github.ref_name }}
          path: windows-assets

      - name: Verify staged release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-assets
          python3 - <<'PY'
          from pathlib import Path

          def require(pattern, root):
              matches = [path for path in Path(root).rglob(pattern) if path.is_file() and path.stat().st_size > 0]
              assert matches, f"missing non-empty {pattern} under {root}"

          require("SHA256SUMS", "dist")
          windows_root = Path("windows-assets")
          windows_files = [path for path in windows_root.rglob("*") if path.is_file()]
          if windows_files:
              try:
                  require("*.msix", "windows-assets")
              except AssertionError:
                  require("*.msixbundle", "windows-assets")
              require("*.cer", "windows-assets")
              require("*.sha256", "windows-assets")
          else:
              print("Windows release artifacts were skipped because trusted MSIX signing is not configured.")
          PY

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
          tags: |
            ghcr.io/cvsz/zworkforce:${{ github.ref_name }}
            ghcr.io/cvsz/zworkforce:${{ needs.prepare-release.outputs.version }}
            ghcr.io/cvsz/zworkforce:latest
          provenance: mode=max
          sbom: true

      - name: Create or update GitHub Release with all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-assets
          mapfile -t assets < <(find dist windows-assets -type f -print)
          ((${#assets[@]} > 0))
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "zWorkforce $GITHUB_REF_NAME" \
              --generate-notes
          fi
