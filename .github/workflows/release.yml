name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    outputs:
      version: ${{ steps.meta.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag, source and main ancestry
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable semantic version tag required" >&2; exit 2; }
          python scripts/verify_release.py --expected "$VERSION"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          zworkforce --version

      - name: Generate SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_sbom.py --output "dist/zworkforce-${{ steps.meta.outputs.version }}.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

  windows-client:
    name: Windows client release
    needs: prepare-release
    runs-on: windows-latest
    environment: production
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
      WINDOWS_MSIX_PUBLISHER: ${{ vars.WINDOWS_MSIX_PUBLISHER }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Configure Azure Artifact Signing
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
        run: |
          $azureValues = @(
              $env:AZURE_CLIENT_ID,
              $env:AZURE_TENANT_ID,
              $env:AZURE_SUBSCRIPTION_ID,
              $env:AZURE_ARTIFACT_SIGNING_ENDPOINT,
              $env:AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME,
              $env:AZURE_ARTIFACT_SIGNING_PROFILE_NAME
          )
          # Publisher is part of the signing configuration boundary. A
          # publisher-only environment must fail closed instead of being
          # mistaken for an intentionally unconfigured Windows release.
          $signingValues = @($azureValues + $env:WINDOWS_MSIX_PUBLISHER)
          $present = @($signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($present.Count -eq 0) {
              "has_signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "Azure Artifact Signing is not configured; skipping Windows MSIX release artifacts."
              exit 0
          }
          if ($present.Count -ne $signingValues.Count) {
              throw "Azure Artifact Signing configuration is incomplete; configure the identity, account, profile, endpoint, and publisher together."
          }
          if ($env:AZURE_ARTIFACT_SIGNING_ENDPOINT -notmatch '^https://') {
              throw "AZURE_ARTIFACT_SIGNING_ENDPOINT must be an HTTPS endpoint."
          }
          "has_signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Audit Windows client environment
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Install-Prerequisites.ps1 -CheckOnly

      - name: Restore
        if: steps.signing.outputs.has_signing == 'true'
        run: dotnet restore ZWorkforceClient/ZWorkforceClient.sln

      - name: Build client
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Build-Client.ps1 -Configuration Release -Platform x64

      - name: Run core tests
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release

      - name: Package versioned MSIX
        if: steps.signing.outputs.has_signing == 'true'
        run: ./ZWorkforceClient/build/windows/Package-Client.ps1 -Configuration Release -Platform x64 -Unsigned -Publisher "$env:WINDOWS_MSIX_PUBLISHER" -Version "${{ needs.prepare-release.outputs.version }}"

      - name: Locate versioned MSIX
        if: steps.signing.outputs.has_signing == 'true'
        id: package
        run: |
          $packageDirectory = Join-Path $PWD "ZWorkforceClient\out\Release-x64"
          $expectedVersion = "${{ needs.prepare-release.outputs.version }}.0"
          $escapedVersion = [regex]::Escape($expectedVersion)
          $packages = @(Get-ChildItem -LiteralPath $packageDirectory -File |
              Where-Object {
                  $_.Extension -in @(".msix", ".msixbundle") -and
                  $_.Name -match ("_" + $escapedVersion + "_")
              })
          if ($packages.Count -ne 1) {
              throw "Expected exactly one versioned unsigned MSIX artifact, found $($packages.Count)."
          }
          "path=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Login to Azure for Artifact Signing
        if: steps.signing.outputs.has_signing == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSIX with Azure Artifact Signing
        if: steps.signing.outputs.has_signing == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: ${{ steps.package.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          enhanced-key-usage: 1.3.6.1.5.5.7.3.3
          timeout: 600

      - name: Verify Azure Artifact Signing signature
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          $packagePath = "${{ steps.package.outputs.path }}"
          $certificatePath = "$packagePath.cer"
          ./ZWorkforceClient/build/windows/Verify-MSIXSignature.ps1 -PackagePath $packagePath -ExpectedPublisher "$env:WINDOWS_MSIX_PUBLISHER" -ExpectedVersion "${{ needs.prepare-release.outputs.version }}.0" -SignerCertificateOutputPath $certificatePath

      - name: Launch smoke check
        if: steps.signing.outputs.has_signing == 'true'
        timeout-minutes: 8
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release -PackagePath "${{ steps.package.outputs.path }}" -ExpectedVersion "${{ needs.prepare-release.outputs.version }}.0" -LaunchSmoke -SkipCertificateTrust

      - name: Generate Windows checksums
        if: steps.signing.outputs.has_signing == 'true'
        run: |
          $packagePath = "${{ steps.package.outputs.path }}"
          $package = Get-Item -LiteralPath $packagePath -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
              "$($package.FullName).sha256",
              "$hash  $($package.Name)$([Environment]::NewLine)",
              [Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows release artifact
        if: steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-windows-client-${{ github.ref_name }}
          path: |
            ZWorkforceClient/out/Release-x64/*.msix
            ZWorkforceClient/out/Release-x64/*.msixbundle
            ZWorkforceClient/out/Release-x64/*.cer
            ZWorkforceClient/out/Release-x64/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows diagnostics
        if: failure() && steps.signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-windows-client-diagnostics-${{ github.run_number }}
          path: |
            ZWorkforceClient/src/**/bin/**
            ZWorkforceClient/src/**/obj/**
            ZWorkforceClient/out/**
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish release
    needs: [prepare-release, windows-client]
    if: always() && needs.prepare-release.result == 'success' && (needs.windows-client.result == 'success' || needs.windows-client.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Python release artifacts
        uses: actions/download-artifact@v8
        with:
          name: zworkforce-${{ github.ref_name }}
          path: dist

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: zworkforce-windows-client-${{ github.ref_name }}
          path: windows-assets

      - name: Verify staged release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-assets
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          def require(pattern, root):
              matches = [path for path in Path(root).rglob(pattern) if path.is_file() and path.stat().st_size > 0]
              assert matches, f"missing non-empty {pattern} under {root}"

          require("SHA256SUMS", "dist")
          windows_root = Path("windows-assets")
          windows_files = [path for path in windows_root.rglob("*") if path.is_file()]
          if windows_files:
              packages = [
                  path for pattern in ("*.msix", "*.msixbundle")
                  for path in windows_root.rglob(pattern)
                  if path.is_file() and path.stat().st_size > 0
              ]
              assert len(packages) == 1, f"expected exactly one Windows package, found {len(packages)}"
              package = packages[0]
              certificates = [path for path in windows_root.rglob("*.cer") if path.is_file() and path.stat().st_size > 0]
              assert certificates, "missing exported public signer certificate"
              checksums = [path for path in windows_root.rglob("*.sha256") if path.is_file() and path.stat().st_size > 0]
              assert len(checksums) == 1, f"expected exactly one Windows checksum, found {len(checksums)}"
              checksum_parts = checksums[0].read_text(encoding="utf-8").strip().split()
              assert len(checksum_parts) >= 2 and re.fullmatch(r"[0-9a-fA-F]{64}", checksum_parts[0]), "invalid Windows checksum record"
              assert checksum_parts[1] == package.name, "Windows checksum is for a different package"
              actual = hashlib.sha256(package.read_bytes()).hexdigest()
              assert checksum_parts[0].lower() == actual, "Windows package checksum mismatch"
          else:
              print("Windows release artifacts were skipped because Azure Artifact Signing is not configured.")
          PY

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
          tags: |
            ghcr.io/cvsz/zworkforce:${{ github.ref_name }}
            ghcr.io/cvsz/zworkforce:${{ needs.prepare-release.outputs.version }}
            ghcr.io/cvsz/zworkforce:latest
          provenance: mode=max
          sbom: true

      - name: Create or update GitHub Release with all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-assets
          mapfile -t assets < <(find dist windows-assets -type f -print)
          ((${#assets[@]} > 0))
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "zWorkforce $GITHUB_REF_NAME" \
              --generate-notes
          fi
