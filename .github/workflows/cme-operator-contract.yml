name: CMe Operator Contract

on:
  pull_request:
    paths:
      - "infrastructure/terraform/cloudflare/*.tf"
      - "deploy/cloudflare/tunnel-ingress.yml"
      - "scripts/verify-cme-production.py"
      - "tests/test_cme_production_verifier.py"
      - "tests/test_cme_hostname_contract.py"
      - "scripts/cloudflare/reconcile-repo-sites.sh"
      - "docs/CME-PRODUCTION-OPERATOR.md"
      - ".github/workflows/cme-operator-contract.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Compile verifier
        run: python3 -m py_compile scripts/verify-cme-production.py
      - name: Test verifier behavior
        run: python3 -m unittest discover -s tests -p test_cme_production_verifier.py -v
      - name: Verify ingress contract
        run: |
          grep -q 'hostname: cme.zeaz.dev' deploy/cloudflare/tunnel-ingress.yml
          grep -q 'service: http://127.0.0.1:8001' deploy/cloudflare/tunnel-ingress.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('deploy/cloudflare/tunnel-ingress.yml').read_text()
          expected = '  - hostname: cme.zeaz.dev\n    service: http://127.0.0.1:8001'
          assert expected in text, 'CMe hostname/origin mapping drifted'
          tf = Path('infrastructure/terraform/cloudflare/cme.tf').read_text()
          main = Path('infrastructure/terraform/cloudflare/main.tf').read_text()
          variables = Path('infrastructure/terraform/cloudflare/variables.tf').read_text()
          assert 'var.cmeerp_hostname' in tf
          assert 'cloudflare_zero_trust_access_application' in tf
          assert 'resource "cloudflare_dns_record" "cmeerp"' in main
          assert 'default     = "cme.zeaz.dev"' in variables
          assert 'default     = "http://127.0.0.1:8001"' in variables
          PY
      - name: Verify Access-denied codes are never live
        run: |
          source /dev/stdin <<<"$(sed -n '/^is_live_code(){/,/^}/p' scripts/cloudflare/reconcile-repo-sites.sh)"
          is_live_code 200
          is_live_code 429
          ! is_live_code 302
          ! is_live_code 401
          ! is_live_code 403
          ! is_live_code 000
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
      - name: Test canonical CMe hostname contract
        run: python3 tests/test_cme_hostname_contract.py
      - name: Terraform format
        run: terraform fmt -check infrastructure/terraform/cloudflare/cme.tf
