name: Publish Container

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        required: true
        default: v3.0.4
      version:
        description: Semantic version without leading v
        required: true
        default: 3.0.4
      latest:
        description: Also update the latest tag
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable semantic version is required" >&2
            exit 2
          }
          [[ "$RELEASE_REF" == "v$RELEASE_VERSION" ]] || {
            echo "ref must be the immutable v$RELEASE_VERSION tag" >&2
            exit 2
          }
          git fetch origin "refs/tags/$RELEASE_REF:refs/tags/$RELEASE_REF" main
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_REF")"
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main
          git checkout --detach "$RELEASE_REF"
          python scripts/verify_release.py --expected "$RELEASE_VERSION"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Refuse existing immutable image tags
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/cvsz/zworkforce"
          for tag in "$RELEASE_REF" "$RELEASE_VERSION"; do
            if docker buildx imagetools inspect "$image:$tag" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing immutable image tag: $image:$tag" >&2
              exit 3
            fi
          done

      - name: Build and push OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/cvsz/zworkforce:${{ inputs.ref }}
            ghcr.io/cvsz/zworkforce:${{ inputs.version }}
            ${{ inputs.latest && 'ghcr.io/cvsz/zworkforce:latest' || '' }}
          provenance: mode=max
          sbom: true
