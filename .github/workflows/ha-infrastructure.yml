name: HA Infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/ha-infrastructure.yml"
      - "deploy/cloudflare/**"
      - "infrastructure/terraform/cloudflare/**"
      - "scripts/cloudflare/**"
      - "scripts/cloudflare-*.sh"
      - "scripts/lib/cloudflare-terraform-env.sh"
      - "scripts/verify-zarvis-online.sh"
      - "docs/HA-CLOUDFLARE-SUPABASE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-infrastructure-production
  cancel-in-progress: false

jobs:
  validate:
    name: validate-ha-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.5"
      - name: Validate repo fallback scripts
        run: |
          bash -n scripts/cloudflare/reconcile-repo-sites.sh
          node --check infrastructure/terraform/cloudflare/workers/repo-under-construction.js
          bash scripts/cloudflare/reconcile-repo-sites.sh --help >/dev/null
      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform/cloudflare fmt -check -recursive
      - name: Terraform init without backend
        run: terraform -chdir=infrastructure/terraform/cloudflare init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform/cloudflare validate
      - name: Validate canonical HA-A ingress contract
        shell: python
        run: |
          from pathlib import Path

          ingress = Path("deploy/cloudflare/tunnel-ingress.yml").read_text()
          tf_dir = Path("infrastructure/terraform/cloudflare")
          tf = "\n".join(p.read_text() for p in sorted(tf_dir.glob("*.tf")))
          expected = {
              "zwf.zeaz.dev": "http://127.0.0.1:9570",
              "zwf-api.zeaz.dev": "http://127.0.0.1:9570",
              "zslog.zeaz.dev": "http://127.0.0.1:9581",
              "studio.zeaz.dev": "http://127.0.0.1:3005",
              "zarvis.zeaz.dev": "http://127.0.0.1:9570",
              "zider.zeaz.dev": "http://127.0.0.1:8085",
              "zcoin.zeaz.dev": "http://127.0.0.1:18082",
          }
          for host, origin in expected.items():
              if f"hostname: {host}\n    service: {origin}" not in ingress:
                  raise SystemExit(f"cloudflared ingress drift: {host} != {origin}")
              if host not in tf or origin not in tf:
                  raise SystemExit(f"terraform contract missing {host} / {origin}")
          if "local.zworkforce_ingress" not in Path("infrastructure/terraform/cloudflare/main.tf").read_text():
              raise SystemExit("managed tunnel config does not include local.zworkforce_ingress")
          print("HA-A ingress contract is consistent")
      - name: Validate Z.A.R.V.I.S. online verifier
        run: bash -n scripts/verify-zarvis-online.sh

  production:
    name: plan-ha-production
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          PIEWDASH_ACCESS_ALLOWED_EMAILS: ${{ secrets.PIEWDASH_ACCESS_ALLOWED_EMAILS }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.CLOUDFLARE_TF_STATE_BUCKET }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCESS_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID
            CLOUDFLARE_TUNNEL_ID PIEWDASH_ACCESS_ALLOWED_EMAILS
            TERRAFORM_STATE_BUCKET CLOUDFLARE_S3_API_ENDPOINT
            CLOUDFLARE_ACCESS_KEY_ID CLOUDFLARE_ACCESS_SECRET_KEY
            SUPABASE_DATABASE_URL
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Missing production secret: $key" >&2; exit 1; }
          done
      - name: HA-B Supabase database preflight
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          service_file="$(mktemp "$RUNNER_TEMP/zworkforce-pgservice.XXXXXX")"
          chmod 600 "$service_file"
          trap 'rm -f -- "$service_file"' EXIT
          PGSERVICEFILE="$service_file" python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import parse_qs, unquote, urlsplit

          parsed = urlsplit(os.environ["SUPABASE_DATABASE_URL"])
          if parsed.scheme not in {"postgres", "postgresql"} or not parsed.hostname:
              raise SystemExit("SUPABASE_DATABASE_URL must be a PostgreSQL URL")
          try:
              port = parsed.port or 5432
          except ValueError as exc:
              raise SystemExit("SUPABASE_DATABASE_URL has an invalid port") from exc

          parameters = {
              "host": parsed.hostname,
              "port": str(port),
              "dbname": unquote(parsed.path.lstrip("/")),
              "user": unquote(parsed.username or ""),
              "password": unquote(parsed.password or ""),
          }
          query = parse_qs(parsed.query, keep_blank_values=True)
          allowed_query = {"sslmode", "connect_timeout", "application_name", "options"}
          unsupported = set(query) - allowed_query
          if unsupported:
              raise SystemExit("SUPABASE_DATABASE_URL has unsupported connection options")
          for key, values in query.items():
              if len(values) != 1:
                  raise SystemExit("SUPABASE_DATABASE_URL has repeated connection options")
              parameters[key] = values[0]
          if not parameters["dbname"] or not parameters["user"] or not parameters["password"]:
              raise SystemExit("SUPABASE_DATABASE_URL is missing a database, user, or password")

          def quote(value):
              if any(ord(char) < 32 or ord(char) == 127 for char in value):
                  raise SystemExit("SUPABASE_DATABASE_URL contains a control character")
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          service = "[zworkforce-preflight]\n" + "".join(
              f"{key}={quote(value)}\n" for key, value in parameters.items()
          )
          service_path = Path(os.environ["PGSERVICEFILE"])
          service_path.write_text(service, encoding="utf-8")
          service_path.chmod(0o600)
          PY
          unset SUPABASE_DATABASE_URL
          PGSERVICEFILE="$service_file" PGSERVICE=zworkforce-preflight \
            psql -v ON_ERROR_STOP=1 -Atc "select 1"
      - name: Render protected Cloudflare environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          PIEWDASH_ACCESS_ALLOWED_EMAILS: ${{ secrets.PIEWDASH_ACCESS_ALLOWED_EMAILS }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.CLOUDFLARE_TF_STATE_BUCKET }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCESS_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 - <<'PY'
          import os
          import shlex
          from pathlib import Path

          secret_names = (
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_ZONE_ID",
              "CLOUDFLARE_TUNNEL_ID",
              "PIEWDASH_ACCESS_ALLOWED_EMAILS",
              "TERRAFORM_STATE_BUCKET",
              "CLOUDFLARE_S3_API_ENDPOINT",
              "CLOUDFLARE_ACCESS_KEY_ID",
              "CLOUDFLARE_ACCESS_SECRET_KEY",
          )
          missing = [name for name in secret_names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing required workflow environment values: " + ", ".join(missing)
              )
          values = {name: os.environ[name] for name in secret_names}
          values.update(
              {
                  "TERRAFORM_BACKEND_TYPE": "r2",
                  "ALLOW_R2_WRITE": "true",
                  "MANAGE_TUNNEL_CONFIG": "false",
                  "STUDIO_ORIGIN": "http://127.0.0.1:3005",
                  "ZWF_ORIGIN": "http://127.0.0.1:9570",
                  "ZWF_API_HOSTNAME": "zwf-api.zeaz.dev",
                  "ZSLOG_HOSTNAME": "zslog.zeaz.dev",
                  "ZSLOG_ORIGIN": "http://127.0.0.1:9581",
                  "ZARVIS_ORIGIN": "http://127.0.0.1:9570",
                  "ZIDER_ORIGIN": "http://127.0.0.1:8085",
              }
          )
          for name, value in values.items():
              if any(character in value for character in ("\n", "\r", "\0")):
                  raise SystemExit(f"Workflow environment value contains a control character: {name}")
          env_file = Path(".env.cloudflare")
          with env_file.open("x", encoding="utf-8") as stream:
              stream.write(
                  "".join(f"{name}={shlex.quote(value)}\n" for name, value in values.items())
              )
          env_file.chmod(0o600)
          PY
      - name: Cloudflare reconcile and create a non-applying plan
        run: ./scripts/cloudflare-apply.sh --all-dns
      - name: Remove rendered secret file
        if: always()
        run: rm -f .env.cloudflare
