name: HA Infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/ha-infrastructure.yml"
      - "deploy/cloudflare/**"
      - "infrastructure/terraform/cloudflare/**"
      - "scripts/cloudflare-*.sh"
      - "scripts/lib/cloudflare-terraform-env.sh"
      - "scripts/verify-zarvis-online.sh"
      - "docs/HA-CLOUDFLARE-SUPABASE.md"
  workflow_dispatch:
    inputs:
      action:
        description: "Production action"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: ha-infrastructure-production
  cancel-in-progress: false

jobs:
  validate:
    name: validate-ha-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.5"
      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform/cloudflare fmt -check -recursive
      - name: Terraform init without backend
        run: terraform -chdir=infrastructure/terraform/cloudflare init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform/cloudflare validate
      - name: Validate canonical HA-A ingress contract
        shell: python
        run: |
          from pathlib import Path

          ingress = Path("deploy/cloudflare/tunnel-ingress.yml").read_text()
          tf = Path("infrastructure/terraform/cloudflare/zworkforce.tf").read_text()
          expected = {
              "zwf.zeaz.dev": "http://127.0.0.1:9570",
              "zwf-api.zeaz.dev": "http://127.0.0.1:9570",
              "zslog.zeaz.dev": "http://127.0.0.1:9581",
              "studio.zeaz.dev": "http://127.0.0.1:3005",
              "zarvis.zeaz.dev": "http://127.0.0.1:9570",
              "zider.zeaz.dev": "http://127.0.0.1:8085",
          }
          for host, origin in expected.items():
              if f"hostname: {host}\n    service: {origin}" not in ingress:
                  raise SystemExit(f"cloudflared ingress drift: {host} != {origin}")
              if host not in tf or origin not in tf:
                  raise SystemExit(f"terraform contract missing {host} / {origin}")
          if "local.zworkforce_ingress" not in Path("infrastructure/terraform/cloudflare/main.tf").read_text():
              raise SystemExit("managed tunnel config does not include local.zworkforce_ingress")
          print("HA-A ingress contract is consistent")
      - name: Validate Z.A.R.V.I.S. online verifier
        run: bash -n scripts/verify-zarvis-online.sh

  production:
    name: ${{ inputs.action }}-ha-production
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          PIEWDASH_ACCESS_ALLOWED_EMAILS: ${{ secrets.PIEWDASH_ACCESS_ALLOWED_EMAILS }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.CLOUDFLARE_TF_STATE_BUCKET }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCESS_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID
            CLOUDFLARE_TUNNEL_ID PIEWDASH_ACCESS_ALLOWED_EMAILS
            TERRAFORM_STATE_BUCKET CLOUDFLARE_S3_API_ENDPOINT
            CLOUDFLARE_ACCESS_KEY_ID CLOUDFLARE_ACCESS_SECRET_KEY
            SUPABASE_DATABASE_URL
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Missing production secret: $key" >&2; exit 1; }
          done
      - name: HA-B Supabase database preflight
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: psql "$SUPABASE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 1"
      - name: Render protected Cloudflare environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          PIEWDASH_ACCESS_ALLOWED_EMAILS: ${{ secrets.PIEWDASH_ACCESS_ALLOWED_EMAILS }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.CLOUDFLARE_TF_STATE_BUCKET }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCESS_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > .env.cloudflare <<EOF
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_ZONE_ID=$CLOUDFLARE_ZONE_ID
          CLOUDFLARE_TUNNEL_ID=$CLOUDFLARE_TUNNEL_ID
          PIEWDASH_ACCESS_ALLOWED_EMAILS=$PIEWDASH_ACCESS_ALLOWED_EMAILS
          TERRAFORM_BACKEND_TYPE=r2
          ALLOW_R2_WRITE=true
          TERRAFORM_STATE_BUCKET=$TERRAFORM_STATE_BUCKET
          CLOUDFLARE_S3_API_ENDPOINT=$CLOUDFLARE_S3_API_ENDPOINT
          CLOUDFLARE_ACCESS_KEY_ID=$CLOUDFLARE_ACCESS_KEY_ID
          CLOUDFLARE_ACCESS_SECRET_KEY=$CLOUDFLARE_ACCESS_SECRET_KEY
          MANAGE_TUNNEL_CONFIG=false
          STUDIO_ORIGIN=http://127.0.0.1:3005
          ZWF_ORIGIN=http://127.0.0.1:9570
          ZWF_API_HOSTNAME=zwf-api.zeaz.dev
          ZSLOG_HOSTNAME=zslog.zeaz.dev
          ZSLOG_ORIGIN=http://127.0.0.1:9581
          ZARVIS_ORIGIN=http://127.0.0.1:9570
          ZIDER_ORIGIN=http://127.0.0.1:8085
          EOF
          chmod 600 .env.cloudflare
      - name: Cloudflare reconcile and plan
        if: inputs.action == 'plan'
        run: ./scripts/cloudflare-apply.sh --all-dns
      - name: Cloudflare reconcile and apply reviewed plan
        if: inputs.action == 'apply'
        run: ./scripts/cloudflare-apply.sh --all-dns --apply
      - name: Verify HA-A and Z.A.R.V.I.S. public health
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://zwf.zeaz.dev/health >/dev/null
          bash scripts/verify-zarvis-online.sh
      - name: Remove rendered secret file
        if: always()
        run: rm -f .env.cloudflare
