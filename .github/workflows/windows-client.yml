name: Windows client

on:
  push:
    paths:
      - "ZWorkforceClient/**"
      - "packages/zarvis/**"
      - ".github/workflows/windows-client.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-signed-candidate.yml"
      - ".github/ISSUE_TEMPLATE/windows-client-bug.yml"
      - "docs/WINDOWS-CLIENT.md"
  # This job is a required branch-protection context. It must be emitted for
  # every pull request; path filtering here would leave unrelated PRs
  # permanently blocked with a missing required check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Audit Windows client environment
        run: ./ZWorkforceClient/build/windows/Install-Prerequisites.ps1 -CheckOnly

      - name: Restore
        run: dotnet restore ZWorkforceClient/ZWorkforceClient.sln

      - name: Build core and packaged client
        run: ./ZWorkforceClient/build/windows/Build-Client.ps1 -Configuration Release -Platform x64

      - name: Run core tests
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release

      - name: Package MSIX
        run: ./ZWorkforceClient/build/windows/Package-Client.ps1 -Configuration Release -Platform x64 -Version 1.0.0

      - name: Restore Z.A.R.V.I.S. Windows client
        run: dotnet restore packages/zarvis/apps/zarvis-windows/src/ZARVIS.Windows/ZARVIS.Windows.csproj

      - name: Test Z.A.R.V.I.S. Windows client
        run: dotnet test packages/zarvis/apps/zarvis-windows/tests/ZARVIS.Windows.Tests/ZARVIS.Windows.Tests.csproj --configuration Release --no-restore

      - name: Build Z.A.R.V.I.S. Windows client
        run: dotnet build packages/zarvis/apps/zarvis-windows/src/ZARVIS.Windows/ZARVIS.Windows.csproj --configuration Release --no-restore

      - name: Launch smoke check
        timeout-minutes: 8
        run: ./ZWorkforceClient/build/windows/Test-Client.ps1 -Configuration Release -ExpectedVersion 1.0.0.0 -LaunchSmoke

      - name: Upload Windows client package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-client-${{ github.run_number }}
          path: |
            ZWorkforceClient/out/*/*.msix
            ZWorkforceClient/out/*/*.msixbundle
            ZWorkforceClient/out/*/*.cer
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zworkforce-client-diagnostics-${{ github.run_number }}
          path: |
            ZWorkforceClient/src/**/bin/**
            ZWorkforceClient/src/**/obj/**
            ZWorkforceClient/out/**
          if-no-files-found: warn
          retention-days: 7
