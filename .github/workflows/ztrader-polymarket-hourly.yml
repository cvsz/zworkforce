name: zTrader Polymarket Hourly Progress Gate\n\non:\n  schedule:\n    - cron: "0 * * * *"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  issues: write\n\nconcurrency:\n  group: ztrader-polymarket-hourly\n  cancel-in-progress: true\n\njobs:\n  hourly-gate:\n    name: Hourly production progress / quality gate\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    defaults:\n      run:\n        working-directory: packages/ztrader/zeaz-intelligence\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n\n      - name: Setup Python\n        uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n          cache: pip\n          cache-dependency-path: packages/ztrader/zeaz-intelligence/pyproject.toml\n\n      - name: Install\n        run: python -m pip install -e ".[dev]"\n\n      - name: Ruff\n        run: ruff check src tests\n\n      - name: Pytest\n        run: pytest -q\n\n      - name: Production-gate inventory\n        shell: bash\n        run: |\n          set -euo pipefail\n          cd "$GITHUB_WORKSPACE"\n          echo "## zTrader Polymarket hourly gate" >> "$GITHUB_STEP_SUMMARY"\n          echo "" >> "$GITHUB_STEP_SUMMARY"\n          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"\n          echo "- UTC run: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"\n          echo "" >> "$GITHUB_STEP_SUMMARY"\n          echo "### Current repository inventory" >> "$GITHUB_STEP_SUMMARY"\n          echo "" >> "$GITHUB_STEP_SUMMARY"\n          for path in \\n            "packages/ztrader/zeaz-intelligence/src/ztrader_intel/polymarket" \\n            "packages/ztrader/zeaz-intelligence/tests" \\n            "packages/ztrader/zeaz-intelligence/README.md"; do\n            if [ -e "$path" ]; then\n              echo "- [x] $path" >> "$GITHUB_STEP_SUMMARY"\n            else\n              echo "- [ ] $path" >> "$GITHUB_STEP_SUMMARY"\n            fi\n          done\n          echo "" >> "$GITHUB_STEP_SUMMARY"\n          echo "Live trading/private-key custody is not enabled by this workflow." >> "$GITHUB_STEP_SUMMARY"\n\n      - name: Update production gate issue\n        if: always()\n        env:\n          GH_TOKEN: ${{ github.token }}\n          GATE_ISSUE: "226"\n        shell: bash\n        run: |\n          set -euo pipefail\n          cd "$GITHUB_WORKSPACE"\n          status="success"\n          if [ "${{ job.status }}" != "success" ]; then\n            status="failure"\n          fi\n          gh issue comment "$GATE_ISSUE" --body "### Hourly zTrader Polymarket gate\n          - Status: **$status**\n          - Commit: `${GITHUB_SHA}`\n          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n          - Automated checks: Ruff + pytest + production-gate inventory\n\n          This is a validation/progress heartbeat; it does not claim that the Polymarket feature set is complete and does not enable live trading."