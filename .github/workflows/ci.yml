name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and runtime dependencies
        run: python3 -m pip install --no-cache-dir '.[test]'
      - name: Compile
        run: python3 -m compileall -q zworkforce tests scripts
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Doctor
        run: ZWORKFORCE_DATA_DIR=/tmp/zworkforce-ci ZWORKFORCE_WORKSPACE_ROOT=$PWD zworkforce doctor
      - name: CLI smoke
        run: zworkforce --version
      - name: JavaScript syntax and example JSON
        run: |
          node --check zworkforce/static/app.js
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('examples').glob('*.json'):
              json.loads(p.read_text())
          PY

  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: python3 -m pip install --no-cache-dir .
      - name: Validate documentation links and repository policy
        run: python3 -m unittest tests.test_documentation_coverage tests.test_repository_policy -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zworkforce
          POSTGRES_PASSWORD: zworkforce
          POSTGRES_DB: zworkforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zworkforce -d zworkforce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZWORKFORCE_TEST_POSTGRES_URL: postgresql://zworkforce:zworkforce@127.0.0.1:5432/zworkforce_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: python3 -m pip install --no-cache-dir .
      - name: PostgreSQL queue/runtime tests
        run: python3 -m unittest tests.test_v3_postgres -v

      - name: PostgreSQL backup and restore drill
        shell: bash
        run: |
          set -euo pipefail
          restore_url="${ZWORKFORCE_TEST_POSTGRES_URL%/zworkforce_ci}/zworkforce_restore"
          docker run --rm --network host \
            postgres:17-alpine \
            psql "$ZWORKFORCE_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zworkforce_restore'
          ZWORKFORCE_DATABASE_URL="$ZWORKFORCE_TEST_POSTGRES_URL" python3 - <<'PY'
          import os
          from zworkforce.db import Database

          url = os.environ["ZWORKFORCE_DATABASE_URL"]
          db = Database(url, "recovery-drill")
          db.put_memory("recovery-drill", None, "recovery-marker", "backup restore sentinel", ["ci"], "ci", "recovery-marker")
          assert db.get_memory("recovery-drill", "recovery-marker")["content"] == "backup restore sentinel"
          PY
          backup_dir="$(mktemp -d)"
          backup_path="$backup_dir/zworkforce-recovery.dump"
          docker run --rm --network host \
            -e "ZWORKFORCE_DATABASE_URL=$ZWORKFORCE_TEST_POSTGRES_URL" \
            -e "ZWORKFORCE_BACKUP_DIR=$backup_dir" \
            -v "$PWD:/workspace" \
            -v "$backup_dir:$backup_dir" \
            -w /workspace \
            postgres:17-alpine \
            bash scripts/backup-postgres.sh "$backup_path"
          test -s "$backup_path"
          test -s "$backup_path.sha256"
          docker run --rm --network host \
            -e "ZWORKFORCE_DATABASE_URL=$restore_url" \
            -e ZWORKFORCE_RESTORE_CONFIRM=YES \
            -v "$PWD:/workspace" \
            -v "$backup_dir:$backup_dir" \
            -w /workspace \
            postgres:17-alpine \
            bash scripts/restore-postgres.sh "$backup_path"
          ZWORKFORCE_DATABASE_URL="$restore_url" python3 - <<'PY'
          import os
          from zworkforce.db import Database

          db = Database(os.environ["ZWORKFORCE_DATABASE_URL"], "recovery-drill")
          marker = db.get_memory("recovery-drill", "recovery-marker")
          assert marker and marker["content"] == "backup restore sentinel"
          assert db.ready()
          print("PostgreSQL backup/restore drill passed")
          PY

  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install release package
        run: python3 -m pip install --no-cache-dir .
      - name: Verify release metadata
        run: python3 scripts/verify_release.py
      - name: Validate operational scripts
        run: bash -n scripts/*.sh
      - name: Validate SBOM generator
        run: |
          run: python3 scripts/generate_sbom.py --output /tmp/zworkforce.cdx.json
          python3 - <<'PY'
          import json
          import zworkforce
          data=json.load(open('/tmp/zworkforce.cdx.json'))
          assert data['bomFormat']=='CycloneDX'
          assert data['metadata']['component']['name']=='zworkforce'
          assert data['metadata']['component']['version']==zworkforce.__version__
          PY
      - name: Exercise deployment smoke script
        shell: bash
        run: |
          set -euo pipefail
          ZWORKFORCE_ENV=development \
          ZWORKFORCE_DATA_DIR=/tmp/zworkforce-smoke \
          ZWORKFORCE_WORKSPACE_ROOT="$PWD" \
          zworkforce serve >/tmp/zworkforce-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9569/health >/dev/null; then break; fi
            sleep 0.25
          done
          ZWORKFORCE_BASE_URL=http://127.0.0.1:9569 bash scripts/smoke-test.sh
      - name: Render production Compose
        env:
          ZWORKFORCE_POSTGRES_PASSWORD: ci-only-password
          ZWORKFORCE_API_KEYS: ci-only-key:superadmin:default:bootstrap:*
        run: docker compose config -q
      - name: Verify release workflow capabilities
        run: |
          grep -q 'actions/attest-build-provenance@v4' .github/workflows/release.yml
          grep -q 'provenance: mode=max' .github/workflows/release.yml
          grep -q 'sbom: true' .github/workflows/release.yml
          grep -q 'gh release create' .github/workflows/release.yml
          grep -q 'WINDOWS_MSIX_PFX_BASE64' .github/workflows/release.yml
          grep -q 'ZWORKFORCE_MSIX_REQUIRE_TRUSTED_SIGNING' ZWorkforceClient/build/windows/Package-Client.ps1

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build hardened image
        shell: bash
        run: |
  VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          docker build --build-arg VERSION="$VERSION" -t zworkforce:ci .

  security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No shell=True in runtime
        run: '! grep -R --line-number --include="*.py" "shell=True" zworkforce'
      - name: No provider secrets in static assets
        run: '! grep -R --line-number -E "API_KEY|provider_api_key|Authorization: Bearer" zworkforce/static'
      - name: Verify source version parity and no recovery workflow
        run: |
          python3 - <<'PY'
          import tomllib
          import zworkforce
          with open('pyproject.toml', 'rb') as handle:
              expected = tomllib.load(handle)['project']['version']
          assert zworkforce.__version__ == expected, (zworkforce.__version__, expected)
          PY
          test ! -e .github/workflows/v3-rematerialize.yml
          test ! -e .github/workflows/v3-materialize.yml
