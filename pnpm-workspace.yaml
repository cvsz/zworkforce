packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/*'
allowBuilds:
  # These packages have native build scripts required by packages/zsp-aitool.
  # Confirmed via `pnpm why` on pnpm 11.25.0 — all are real native dependencies.
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5
  - proxy-addr@2.0.8
  - sharp@0.35.5
  - shell-quote@1.11.0
  - source-map-js@1.2.2
  - qs@6.16.0
overrides:
  qs: 6.16.0
  # GHSA advisories: force transitive deps past fixed versions.
  postcss-selector-parser: 7.1.6
  proxy-addr: 2.0.8
  sharp: 0.35.5
  source-map-js: 1.2.2
