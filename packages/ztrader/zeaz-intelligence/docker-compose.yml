services:
  ztrader-intelligence:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ZTRADER_INTEL_DB: /app/data/ztrader_intel.db
    ports:
      - "${ZTRADER_INTEL_PORT:-8218}:8218"
    volumes:
      - ztrader_intel_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8218/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ztrader_intel_data:
