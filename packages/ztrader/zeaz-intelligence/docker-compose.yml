services:
  ztrader-intelligence:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ZTRADER_INTEL_PORT:-8218}:8218"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8218/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
