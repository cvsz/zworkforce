services:
  zarvis-owner-domain:
    image: nginx:1.27-alpine
    network_mode: host
    user: "${ZARVIS_OWNER_UID:-1000}:${ZARVIS_OWNER_GID:-1000}"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0777
      - /tmp:size=8m,mode=1777
    volumes:
      - ./ops/zarvis-owner-domain/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.zarvis-owner-domain/certs:/etc/nginx/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider --no-check-certificate --header='Host: zarvis.zeaz.dev' https://127.0.0.1:8443/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
