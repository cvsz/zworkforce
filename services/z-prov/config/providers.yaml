default_model: zeaz-auto

providers:
  ollama:
    api: openai
    base_url: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    api_key: ${OLLAMA_API_KEY:-ollama}

  litellm:
    api: openai
    base_url: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
    api_key: ${LITELLM_API_KEY:-}

  anthropic:
    api: anthropic
    base_url: https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY:-}
    api_version: "2023-06-01"

  openai:
    api: responses
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY:-}

  openrouter:
    api: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY:-}
    headers:
      HTTP-Referer: ${OPENROUTER_SITE_URL:-https://zeaz.dev}
      X-Title: ZeaZ Provider

  openrouter-free:
    enabled: ${FREE_CLOUD_FALLBACK_ENABLED:-false}
    api: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY:-}
    headers:
      HTTP-Referer: ${OPENROUTER_SITE_URL:-https://zeaz.dev}
      X-Title: ZeaZ Provider Free Fallback

  gemini-free:
    enabled: ${FREE_CLOUD_FALLBACK_ENABLED:-false}
    api: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY:-}

  groq-free:
    enabled: ${FREE_CLOUD_FALLBACK_ENABLED:-false}
    api: openai
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY:-}

  gemini:
    api: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY:-}

  azure:
    api: azure
    base_url: ${AZURE_OPENAI_BASE_URL:-https://example.openai.azure.com/openai/deployments/example}
    api_key: ${AZURE_OPENAI_API_KEY:-}
    api_version: ${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}

  groq:
    api: openai
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY:-}

  mistral:
    api: openai
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY:-}

  deepseek:
    api: openai
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:-}

  xai:
    api: openai
    base_url: https://api.x.ai/v1
    api_key: ${XAI_API_KEY:-}

  together:
    api: openai
    base_url: https://api.together.xyz/v1
    api_key: ${TOGETHER_API_KEY:-}

  fireworks:
    api: openai
    base_url: https://api.fireworks.ai/inference/v1
    api_key: ${FIREWORKS_API_KEY:-}

  nvidia:
    api: openai
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY:-}

  perplexity:
    api: openai
    base_url: https://api.perplexity.ai
    api_key: ${PERPLEXITY_API_KEY:-}

  custom:
    enabled: ${CUSTOM_PROVIDER_ENABLED:-false}
    api: openai
    base_url: ${CUSTOM_PROVIDER_BASE_URL:-http://127.0.0.1:9000/v1}
    api_key: ${CUSTOM_PROVIDER_API_KEY:-}

models:
  zeaz-auto:
    provider: litellm
    model: zeaz-auto
    fallbacks:
      - provider: ollama
        model: ${ZEAZ_LOCAL_MODEL:-qwen3:8b}

  zeaz-free:
    provider: ollama
    model: ${ZEAZ_LOCAL_MODEL:-qwen3:8b}
    fallbacks:
      - provider: openrouter-free
        model: ${OPENROUTER_FREE_MODEL:-openrouter/free}
      - provider: gemini-free
        model: ${GEMINI_FREE_MODEL:-gemini-2.5-flash-lite}
      - provider: groq-free
        model: ${GROQ_FREE_MODEL:-openai/gpt-oss-20b}

  zeaz-qwen-free:
    provider: ollama
    model: ${ZEAZ_QWEN_LOCAL_MODEL:-qwen3:8b}
    fallbacks:
      - provider: openrouter-free
        model: ${OPENROUTER_QWEN_FREE_MODEL:-openrouter/free}

  zeaz-kimi-free:
    provider: ollama
    model: ${ZEAZ_KIMI_LOCAL_MODEL:-kimi-k2:latest}
    fallbacks:
      - provider: openrouter-free
        model: ${OPENROUTER_KIMI_FREE_MODEL:-openrouter/free}

  zeaz-openrouter-free-all:
