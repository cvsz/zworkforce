[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zworkforce"
version = "3.0.4"
description = "Enterprise AI Workforce control plane, distributed agent runtime, workflows, evaluation and AI FinOps platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "cvsz"}]
keywords = ["ai", "agents", "workforce", "finops", "llm", "orchestration", "workflow", "postgresql"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "psycopg[binary]>=3.3.4,<4",
  "PyJWT[crypto]>=2.13,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4,<4"]
oidc = ["PyJWT[crypto]>=2.13,<3"]
aws = ["boto3>=1.40,<2"]
s3 = ["boto3>=1.40,<2"]
voice-live = ["google-genai>=1.14,<3"]
test = ["httpx>=0.27.0,<1", "botocore>=1.40,<2"]
all = ["boto3>=1.40,<2", "google-genai>=1.14,<3"]

[project.scripts]
zworkforce = "zworkforce.workspace_cli:main"
zktcoder = "zworkforce.zktcoder:main"

[tool.setuptools]
packages = ["zworkforce"]
include-package-data = true

[tool.setuptools.package-data]
zworkforce = ["static/*.html", "static/*.css", "static/*.js", "prometa_data/*.json"]
