apiVersion: apps/v1
kind: Deployment
metadata:
  name: zworkforce-outbox
  namespace: zworkforce
spec:
  replicas: 2
  selector:
    matchLabels: {app: zworkforce-outbox}
  template:
    metadata:
      labels: {app: zworkforce-outbox}
    spec:
      serviceAccountName: zworkforce
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: outbox
        image: ghcr.io/cvsz/zworkforce:v3.0.4
        args: ["outbox", "--poll", "2"]
        envFrom:
          - configMapRef: {name: zworkforce}
          - secretRef: {name: zworkforce-secrets}
        resources:
          requests: {cpu: "50m", memory: "96Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zworkforce-outbox
  namespace: zworkforce
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: zworkforce-outbox}
