apiVersion: apps/v1
kind: Deployment
metadata:
  name: zworkforce-worker
  namespace: zworkforce
spec:
  replicas: 2
  selector:
    matchLabels: {app: zworkforce-worker}
  template:
    metadata:
      labels: {app: zworkforce-worker}
    spec:
      serviceAccountName: zworkforce
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: worker
        image: ghcr.io/cvsz/zworkforce:v3.0.4
        args: ["worker"]
        envFrom:
          - configMapRef:
              name: zworkforce
          - secretRef:
              name: zworkforce-secrets
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits: {cpu: "2", memory: "2Gi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
          - {name: workspace, mountPath: /workspace}
          - {name: artifacts, mountPath: /artifacts}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim: {claimName: zworkforce-workspace}
        - name: artifacts
          persistentVolumeClaim: {claimName: zworkforce-artifacts}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zworkforce-worker
  namespace: zworkforce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zworkforce-worker
  minReplicas: 1
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
